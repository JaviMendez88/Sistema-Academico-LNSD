<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Inicio de sesión del Sistema Académico del Liceo Nuevo de Santo Domingo">

    <title>Iniciar Sesión | Sistema Académico LNSD</title>


    <!-- =========================================
         CSS PRINCIPAL
    ========================================== -->

    <link rel="stylesheet"
          href="../../Styles/main.css">


    <!-- =========================================
         BOOTSTRAP ICONS
    ========================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


    <!-- =========================================
         LOGIN
    ========================================== -->

    <section class="login-page">

        <div class="login-container">


            <!-- =====================================
                 ENCABEZADO
            ====================================== -->

            <div class="login-header">

                <img src="../../Assets/logo-lnsd.jpeg"
                     alt="Logo Liceo Nuevo de Santo Domingo"
                     class="login-logo">


                <h1>
                    Sistema Académico LNSD
                </h1>


                <p>
                    Acceso al sistema institucional
                </p>

            </div>



            <!-- =====================================
                 FORMULARIO
            ====================================== -->

            <form class="login-form">


                <!-- CORREO -->

                <div class="form-group">

                    <label for="email">

                        <i class="bi bi-envelope"></i>

                        Correo electrónico

                    </label>


                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="usuario@lnsd.ed.cr"
                           required>

                </div>



                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">

                        <i class="bi bi-lock"></i>

                        Contraseña

                    </label>


                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="********"
                           required>

                </div>



                <!-- =====================================
                     BOTÓN INGRESAR
                ====================================== -->

                <a href="../_Dashboards/DashboardAdministrador.html"
                   class="btn-primary login-button">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Ingresar

                </a>



            <!-- =====================================
                 VOLVER AL SITIO
            ====================================== -->

            <div class="login-footer">

                <a href="../_LandingPage/LandingPage.html">

                    <i class="bi bi-arrow-left"></i>

                    Volver al sitio principal

                </a>

            </div>


        </div>

    </section>


</body>

</html>
