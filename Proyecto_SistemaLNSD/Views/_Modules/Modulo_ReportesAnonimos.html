<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reporte Anónimo - Sistema Académico LNSD">

    <title>
        Reporte Anónimo | Sistema Académico LNSD
    </title>


    <!-- =========================================
         CSS PRINCIPAL
    ========================================== -->

    <link rel="stylesheet"
          href="../../Styles/main.css">


    <!-- =========================================
         BOOTSTRAP ICONS
    ========================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


    <!-- =========================================
         REPORTE ANÓNIMO
    ========================================== -->

    <div class="login-page">

        <div class="login-container">


            <!-- CABECERA -->

            <div class="login-header">

                <img src="../../Assets/logo-lnsd.jpeg"
                     alt="Logo Liceo Nuevo de Santo Domingo"
                     class="login-logo">

                <h1>
                    <i class="bi bi-shield-exclamation"></i>
                    Reporte Anónimo
                </h1>

                <p>
                    Informa de forma confidencial cualquier situación de abuso
                    o delito dentro de la institución
                </p>

            </div>


            <!-- AVISO DE CONFIDENCIALIDAD -->

            <div class="alert-box">

                <i class="bi bi-lock"></i>

                <p>
                    Este formulario no solicita tu nombre. Tu reporte se
                    enviará de forma confidencial directamente a la
                    administración del centro educativo.
                </p>

            </div>


            <!-- FORMULARIO -->

            <form>

                <div class="form-group">

                    <label>
                        Tipo de Situación
                    </label>

                    <select style="width:100%; padding:12px; border:1px solid #dcdcdc; border-radius:8px; font-size:15px;">

                        <option>
                            Abuso físico
                        </option>

                        <option>
                            Abuso verbal o psicológico
                        </option>

                        <option>
                            Bullying / Acoso escolar
                        </option>

                        <option>
                            Discriminación
                        </option>

                        <option>
                            Uso o distribución de sustancias
                        </option>

                        <option>
                            Otro
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Lugar donde Ocurrió
                    </label>

                    <input type="text"
                           placeholder="Ej. Aula 5, pasillo, patio...">

                </div>


                <div class="form-group">

                    <label>
                        Fecha Aproximada
                    </label>

                    <input type="date">

                </div>


                <div class="form-group">

                    <label>
                        Personas Involucradas (opcional)
                    </label>

                    <input type="text"
                           placeholder="Puedes describirlas sin necesidad de dar tu nombre">

                </div>


                <div class="form-group">

                    <label>
                        Descripción de la Situación
                    </label>

                    <textarea rows="5"
                              style="width:100%; padding:12px; border:1px solid #dcdcdc; border-radius:8px; font-size:15px; font-family:inherit; resize:vertical;"
                              placeholder="Describe lo sucedido con el mayor detalle posible..."></textarea>

                </div>


                <div class="form-group">

                    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">

                        <input type="checkbox">

                        Confirmo que la información proporcionada es verídica

                    </label>

                </div>


                <div class="login-button">

                    <button class="btn-primary"
                            style="width:100%;">

                        <i class="bi bi-send"></i>

                        Enviar Reporte Anónimo

                    </button>

                </div>

            </form>


            <!-- PIE -->

            <div class="login-footer">

                <a href="../_LandingPage/LandingPage.html">
                    <i class="bi bi-arrow-left"></i>
                    Volver al inicio
                </a>

            </div>

        </div>

    </div>


</body>
</html>
